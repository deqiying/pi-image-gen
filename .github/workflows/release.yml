name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22.19.0"
  PNPM_VERSION: "11.18.0"
  # Use the PI-Desktop release whose plugin-devkit protocol is used below.
  PI_DESKTOP_REF: "v0.15.1-beta.3"

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify tag belongs to main and matches package versions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`unexpected release tag: ${tag}`);
          }

          const expectedVersion = tag.slice(1);
          for (const file of ["package.json", "package-lock.json", "manifest.json"]) {
            const value = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (value !== expectedVersion) {
              throw new Error(`${file} has version ${value}, expected ${expectedVersion}`);
            }
          }
          NODE

  build:
    name: Check and prepare Marketplace release (${{ matrix.os }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out plugin repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: plugin
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: plugin/package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install plugin dependencies
        run: npm ci
        working-directory: plugin
      - name: Run plugin checks
        run: npm run check
        working-directory: plugin
      - name: Check out PI-Desktop plugin devkit
        uses: actions/checkout@v4
        with:
          repository: vastsa/PI-Desktop
          ref: ${{ env.PI_DESKTOP_REF }}
          path: pi-desktop
          fetch-depth: 1

      - name: Build PI-Desktop plugin devkit
        run: pnpm install --frozen-lockfile --filter "@pi-desktop/plugin-devkit..."
        working-directory: pi-desktop

      - name: Build plugin devkit CLI
        run: pnpm --filter "@pi-desktop/plugin-devkit..." build
        working-directory: pi-desktop

      - name: Validate plugin manifest with PI-Desktop devkit
        run: node pi-desktop/packages/plugin-devkit/dist/cli.js check plugin

      - name: Prepare Marketplace release with PI-Desktop devkit
        run: node pi-desktop/packages/plugin-devkit/dist/cli.js publish plugin --out plugin/dist --ref refs/tags/${{ github.ref_name }} --channel stable

      - name: Upload Marketplace release assets
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-${{ matrix.os }}
          path: |
            plugin/dist/*.piplug
            plugin/dist/*.submission.json
          if-no-files-found: error

  release:
    name: Create Marketplace GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Download Marketplace release assets
        uses: actions/download-artifact@v4
        with:
          name: marketplace-ubuntu-latest
          path: release-assets

      - name: Create publisher release for Marketplace submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.piplug \
            release-assets/*.submission.json \
            --verify-tag \
            --title "PI Image Generation $GITHUB_REF_NAME" \
            --generate-notes

  publish-npm:
    name: Publish to npm
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing authenticates through GitHub OIDC, so no long-lived npm token is stored.
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The pinned Node version bundles npm 10, which predates trusted publishing support.
      - name: Install current npm and verify trusted publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@latest
          npm --version
          npm trust --help >/dev/null

      - name: Skip when this version is already published
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./package.json').name")"
          if npm view "${package}@${version}" version >/dev/null 2>&1; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "${package}@${version} is already on npm; skipping publish."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # access=public comes from package.json publishConfig; provenance needs the id-token above.
          npm publish --provenance
